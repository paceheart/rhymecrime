<script>
(function () {
  var f = document.getElementById("rhymecrime-search");
  if (!f || !f.getAttribute("data-rc-path-search")) return;
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var v1 = (f.word1.value || "").trim();
    var v2 = (f.word2.value || "").trim();
    if (v1 === "" && v2 !== "") {
      v1 = v2;
      v2 = "";
    }
    if (v1 === "" && v2 === "") {
      window.location.href = "/";
      return;
    }
    var enc = encodeURIComponent;
    window.location.href = v2 === "" ? "/" + enc(v1) : "/" + enc(v1) + "/" + enc(v2);
  });
})();
</script>

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RhymeCrime Lambda + HTTP API + DynamoDB (Plan D)

Globals:
  Function:
    Timeout: 29
    # 1769 MB is Lambda's "1 full vCPU" tier: CPU time is allocated linearly
    # with memory and 1 vCPU is the breakpoint where Ruby stops paying a
    # multi-tenant context-switch tax on JSON parsing + GC. The set_related
    # path on a common cue (~3K related lemmas → ~150 +BatchGetItem+ calls
    # over ~100 KB of JSON-encoded responses) was tripping the 29-second
    # API Gateway timeout at the previous +512 MB+ (~⅓ vCPU) setting; bumping
    # here, combined with the +parallel_batch_get_items+ fan-out in
    # +dynamo_store.rb+ and the inflight +RHYMECRIME_LOG_TIMING+ phase logs,
    # gets us back under budget. Cost impact: ~3.5x per-ms billed, but the
    # function also runs ~3-5x faster, so total billed-ms per request goes
    # *down*. Pricing: us-east-1 arm64 = $0.0000133334 / GB-second.
    MemorySize: 1769
    # Match Gemfile +ruby "~> 3.4.0"+ — AWS picks the patch level inside the
    # +ruby3.4+ managed runtime; pessimistic Gemfile pin surfaces 3.5/4.0
    # contributor drift before deploy rather than after.
    Runtime: ruby3.4
    # arm64 is ~20% cheaper than x86_64 on Lambda compute and matches the
    # arm64-darwin dev host, so +sam build --use-container+ is a same-arch
    # build (no Rosetta / qemu emulation, no cross-platform native-gem dance).
    # All gems we depend on ship arm64-linux artifacts.
    Architectures:
      - arm64

Parameters:
  TableName:
    Type: String
    Default: rhymecrime
  FeedbackTableName:
    Type: String
    Default: rhymecrime-feedback
  # Apex domain to point at the HTTP API (e.g. +rhymecrime.com+). Leave empty
  # to skip all custom-domain resources — the deploy still produces a working
  # +execute-api.us-east-1.amazonaws.com+ URL via +HttpApiUrl+. Set via
  # +samconfig.toml+ +parameter_overrides+ once the apex's NS records have
  # been delegated to the +HostedZoneId+ Route 53 zone.
  #
  # Apex only by design (per +HasCustomDomain+ + the +ApexAliasRecord+
  # below). To also serve +www.<domain>+, add a second
  # +AWS::ApiGatewayV2::ApiMapping+ + +AWS::Route53::RecordSet+ pair off the
  # same +Certificate+ (extend +DomainValidationOptions+ + +SubjectAlternativeNames+
  # too). Skipped today because the CC-BY-SA-data version of this app
  # historically lived on a single hostname.
  DomainName:
    Type: String
    Default: ""
    Description: Apex domain (e.g. rhymecrime.com); leave empty to skip custom-domain wiring.
  # Route 53 public hosted zone ID for +DomainName+. Required if +DomainName+
  # is set: +AWS::CertificateManager::Certificate+ uses it to auto-create
  # the DNS-validation CNAME (and tear it down at delete time), and the
  # +ApexAliasRecord+ below writes the apex A-ALIAS into it. Find via
  # +aws route53 list-hosted-zones --profile paceheart+.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone ID (e.g. Z0123ABC...). Required if DomainName is set.

Conditions:
  # Single gate for every custom-domain resource. Lets the stack deploy with
  # +DomainName+ unset (CI / first-time deploy / domain not yet delegated to
  # Route 53) without conditionally referencing a non-existent +Certificate+
  # ARN. Add new domain-related resources with +Condition: HasCustomDomain+
  # so they all flip together — half-on stacks (cert without alias record,
  # alias record without cert) leave the apex pointing nowhere or stuck on
  # the previous deploy's ALIAS.
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  RhymecrimeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Feedback table: one item per thumbs click. Composite key lets us
  # +Query+ all votes for a single (cue, related) pair without scanning,
  # while +Scan+ is still cheap enough at expected feedback volume to drive
  # the periodic export back into curated/related.csv. Kept separate from
  # +RhymecrimeTable+ so the function's read policy on the main table
  # stays read-only — write capability is scoped to this table only.
  RhymecrimeFeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref FeedbackTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RhymecrimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      # +CodeUri+ points at a staging directory populated by +bin/stage-lambda+,
      # not the repo root. SAM CLI's +CopySource+ phase walks the entire
      # +CodeUri+ tree before any build hook fires, and it does NOT honor
      # +.samignore+ / +.gitignore+ / +.dockerignore+, so a +CodeUri: .+ build
      # both (a) drags 4+ GB of corpora + MPNet vectors through copy-source
      # and (b) crashes on +.venv/bin/python3+, which is an absolute symlink
      # to a uv-managed Python that doesn't exist inside the build container.
      # +bin/stage-lambda+ enumerates the files the runtime actually opens
      # — see the doc-comment header there for the require-graph audit.
      #
      # Build with +sam build --use-container+ so the default
      # +RubyBundlerBuilder+ runs +bundle install+ inside
      # +public.ecr.aws/sam/build-ruby3.4+ and native gems (+msgpack+ has a
      # C extension on the lemma-map hot path) compile for arm64-linux
      # instead of the build host's arm64-darwin.
      CodeUri: lambda-build/
      Handler: lambda_handler.handler
      Environment:
        Variables:
          RHYMECRIME_DATA_SOURCE: dynamodb
          RHYMECRIME_TABLE_NAME: !Ref TableName
          RHYMECRIME_FEEDBACK_TABLE_NAME: !Ref FeedbackTableName
          TABLE_NAME: !Ref TableName
          # Lambda's Ruby runtime ships with +LANG+ unset, leaving
          # +Encoding.default_external+ at US-ASCII. The AWS SDK's JSON parser
          # then chokes on any multibyte UTF-8 byte in a DynamoDB response
          # (e.g. +\xC3+ from +café+ / +naïve+ in our dict). +lambda_handler+
          # also force-sets +Encoding.default_external = UTF_8+ as a backstop;
          # this env var fixes it at the source so any other process spawned
          # by the runtime (less of a concern in practice, but cheap) inherits
          # the right locale too.
          LANG: en_US.UTF-8
          # Turn on +Rhymecrime::Timing.measure+ so each phase of
          # +really_find_rhyming_tuples+ (find+filter, prefetch.{relateds_words,
          # relateds_rimes, rhyme_cohort_words}, rhyme-bucket loop, prune) plus
          # each underlying +batch_get_words+ / +batch_get_rimes+ logs its
          # wall-clock to CloudWatch. Cheap (a +warn+ per phase), and the only
          # way to attribute a slow request to a specific stage. Flip to
          # +"0"+ (or remove this line) once the set_related perf work has
          # stabilized; in steady state we don't need this log volume.
          RHYMECRIME_LOG_TIMING: "1"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RhymecrimeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RhymecrimeFeedbackTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET
        ApiHealth:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        ApiFeedback:
          Type: HttpApi
          Properties:
            Path: /feedback
            Method: POST
        # Catch-all for static assets (+/crimestyle.css+, +/feedback.js+, etc.)
        # served by +ASSET_ROUTES+ in +lambda_handler.rb+. Without it, API
        # Gateway 404s every asset request before the Lambda sees it, the
        # browser falls back to default styling, and the page renders with a
        # white background.
        #
        # +Method: GET+ keeps the proxy GET-only so random +POST /anything+
        # still 404s at the API Gateway layer instead of paying for a Lambda
        # cold-start. New POST/PUT endpoints get their own explicit route
        # above; longest-match wins, so +POST /feedback+ above is unaffected.
        ApiAssetProxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: GET

  # ---------------- Custom domain (apex via Route 53 ALIAS) ----------------
  # All four resources are gated on +HasCustomDomain+ so the stack still
  # deploys cleanly with +DomainName=""+. Resource creation order is implicit
  # via +!Ref+ / +!GetAtt+ dependencies: Certificate → ApiCustomDomain
  # (needs +CertificateArn+) → ApiMapping (needs +DomainName+) and
  # ApexAliasRecord (needs +RegionalDomainName+ from ApiCustomDomain).

  # ACM certificate, DNS-validated through the same Route 53 zone we control.
  # +DomainValidationOptions.HostedZoneId+ tells ACM "create the validation
  # CNAME for me in this zone" (instead of asking us to add it manually),
  # so the +sam deploy+ block on first issue is just the DNS propagation
  # delay (~5 min in practice). Subsequent stack updates that don't change
  # +DomainName+ are no-ops on the cert — the same ARN is reused.
  #
  # Region: this resource lives in us-east-1 along with the rest of the
  # stack, which is correct for HTTP API +REGIONAL+ endpoints (the cert
  # must be in the same region as the API). Don't mistake this for the
  # CloudFront / edge-optimized API Gateway pattern that requires the cert
  # in us-east-1 specifically — that's a *different* invariant.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # API Gateway v2 (HTTP API) custom-domain endpoint. +REGIONAL+ is the only
  # +EndpointType+ HTTP API supports — +EDGE+ is REST-API-only. +TLS_1_2+
  # is the modern minimum (drops TLS 1.0 / 1.1 clients, which are <0.1% of
  # web traffic in 2026 and not worth the protocol-downgrade attack surface).
  ApiCustomDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref Certificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  # Maps the custom domain to the HTTP API's +$default+ stage. SAM auto-
  # generates an HTTP API named +ServerlessHttpApi+ when the function has any
  # +HttpApi+-typed event (which ours does, for +/+ + +/health+ + +/feedback+
  # + +/{proxy+}+) — that implicit logical ID is what we +!Ref+ here.
  # If we ever switch to an explicit +AWS::Serverless::HttpApi+ resource,
  # update the +!Ref+ to its logical ID; it will NOT be +ServerlessHttpApi+
  # anymore.
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref ApiCustomDomain
      Stage: $default

  # Route 53 A-ALIAS at the apex. Apex domains can't be CNAMEs (DNS spec —
  # the apex must always have an SOA / NS record set, and CNAME forbids
  # coexisting records at the same name), so we use Route 53's
  # AWS-proprietary "Alias" record, which is stored as A but resolves to
  # the API Gateway's regional endpoint. The +HostedZoneId+ inside
  # +AliasTarget+ is API-Gateway-side (different from our zone's
  # +HostedZoneId+) — +!GetAtt ApiCustomDomain.RegionalHostedZoneId+
  # returns the right one automatically.
  #
  # +EvaluateTargetHealth: false+ because the API Gateway endpoint already
  # has its own health/SLA managed by AWS; Route 53 health-checks would
  # only add cost without adding signal.
  ApexAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiCustomDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  HttpApiUrl:
    Description: HTTP API base URL (always present; serves traffic regardless of custom-domain wiring)
    Value: !GetAtt ServerlessHttpApi.ApiEndpoint
  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Public custom-domain URL (apex; HTTPS only)
    Value: !Sub "https://${DomainName}"
  TableNameOut:
    Value: !Ref RhymecrimeTable
  FeedbackTableNameOut:
    Value: !Ref RhymecrimeFeedbackTable

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: RhymeCrime Lambda + HTTP API + DynamoDB (Plan D)

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Runtime: ruby3.3
    Architectures:
      - x86_64

Parameters:
  TableName:
    Type: String
    Default: rhymecrime
  FeedbackTableName:
    Type: String
    Default: rhymecrime-feedback

Resources:
  RhymecrimeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  # Feedback table: one item per thumbs click. Composite key lets us
  # +Query+ all votes for a single (cue, related) pair without scanning,
  # while +Scan+ is still cheap enough at expected feedback volume to drive
  # the periodic export back into spec/related.csv. Kept separate from
  # +RhymecrimeTable+ so the function's read policy on the main table
  # stays read-only — write capability is scoped to this table only.
  RhymecrimeFeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref FeedbackTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  RhymecrimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Environment:
        Variables:
          RHYMECRIME_DATA_SOURCE: dynamodb
          RHYMECRIME_TABLE_NAME: !Ref TableName
          RHYMECRIME_FEEDBACK_TABLE_NAME: !Ref FeedbackTableName
          TABLE_NAME: !Ref TableName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RhymecrimeTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RhymecrimeFeedbackTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: /
            Method: GET
        ApiHealth:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
        ApiFeedback:
          Type: HttpApi
          Properties:
            Path: /feedback
            Method: POST

Outputs:
  HttpApiUrl:
    Description: HTTP API base URL (see also AWS Console → API Gateway)
    Value: !GetAtt ServerlessHttpApi.ApiEndpoint
  TableNameOut:
    Value: !Ref RhymecrimeTable
  FeedbackTableNameOut:
    Value: !Ref RhymecrimeFeedbackTable
